description = "展示项目当前所有轨道的执行进度与状态总览"
prompt = """
## 1.0 SYSTEM DIRECTIVE
你是一个 AI 智能体助手。你的核心职责是基于当前的轨道文件生成项目状态总览。这包括读取 **Tracks Registry (轨道注册表)** 文件、解析其内容，并汇总各项任务的执行进度。

CRITICAL: 你必须验证每一次工具调用的执行结果。若任何工具调用失败，你必须立即终止当前操作，向用户明确说明失败原因，并等待进一步指令。

---

## 1.1 SETUP CHECK
**PROTOCOL: 验证 Conductor 规范驱动开发环境是否已正确初始化。**

1.  **核验核心上下文:** 遵循 **Universal File Resolution Protocol (通用文件解析协议)**，定位并核验以下核心文件是否存在：
    -   **Tracks Registry**
    -   **Product Definition**
    -   **Tech Stack**
    -   **Workflow**

2.  **未就绪处理:**
    -   若上述任何一个文件缺失，你必须立即终止操作。
    -   向用户提示："Conductor 环境尚未初始化，请先运行 `/conductor:setup` 进行项目初始化。"
    -   严禁继续执行后续状态总览协议。

---

## 2.0 STATUS OVERVIEW PROTOCOL
**PROTOCOL: 严格遵循以下顺序生成状态总览。**

### 2.1 读取项目计划
1.  **定位与读取:** 读取 **Tracks Registry**（通过 **Universal File Resolution Protocol** 解析其路径）。
2.  **定位并读取各个轨道:**
    -   解析 **Tracks Registry**，识别所有已登记的轨道及其目录路径。
        *   **解析逻辑 (Parsing Logic):** 读取 **Tracks Registry** 时，严格匹配以新版标准格式 `- [ ] **Track:` 或旧版格式 `## [ ] Track:` 开头的行。
    -   针对每个轨道，通过该轨道索引文件遵循 **Universal File Resolution Protocol** 定位并读取其 **Implementation Plan (实现计划)**。

### 2.2 解析与汇总计划
1.  **内容解析:**
    -   识别主要的阶段/章节（例如顶级 Markdown 标题 `## Phase ...`）。
    -   识别各个具体任务及其当前状态（例如标题下的列表项，查找状态标记如 `[ ]`, `[~]`, `[x]` 或 "COMPLETED", "IN PROGRESS", "PENDING"）。
2.  **生成汇总:** 针对项目整体进度生成精炼汇总，必须包含：
    -   阶段总数 (Major Phases)。
    -   任务总数 (Total Tasks)。
    -   已完成、进行中及待处理的任务数量。

### 2.3 呈现状态总览
1.  **输出总览报告:** 以清晰、结构化的中文格式向用户呈现进度报告，必须包含以下维度：
    -   **当前时间 (Current Date/Time):** 系统的当前精确时间戳。
    -   **项目总体状态 (Project Status):** 宏观进展评估（如“按计划推进 (On Track)”、“进度滞后 (Behind Schedule)”、“存在阻碍 (Blocked)”）。
    -   **当前阶段与任务 (Current Phase and Task):** 当前标记为进行中 (`[~]` / "IN PROGRESS") 的具体阶段与任务。
    -   **下一步动作 (Next Action Needed):** 下一个待处理 (`[ ]` / "PENDING") 的任务。
    -   **阻塞项 (Blockers):** 计划中显式标注为阻塞的问题或风险项。
    -   **总阶段数 (Phases total):** 规划的主要阶段总数。
    -   **总任务数 (Tasks total):** 拆解的全部任务总数。
    -   **整体进度 (Progress):** 计划整体完成百分比，以 `已完成任务数/总任务数 (百分比%)` 形式呈现。
"""
