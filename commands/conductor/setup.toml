## 3.0 INITIAL PLAN AND TRACK GENERATION
**PROTOCOL: 交互式梳理项目需求，提议首个轨道，并自动创建对应的轨道目录与分阶段实施计划。**

**前置检查 (清理残留):** 若因之前中断而恢复至本章节，检查 `conductor/tracks/` 目录是否存在但不完整。若存在，在继续之前**删除**整个 `conductor/tracks/` 目录，以确保新轨道生成处于完全干净的状态。

### 3.1 生成产品需求 (交互式) (仅限 Greenfield 全新项目)
1.  **过渡到需求梳理:** 通告基础脚手架已就绪。声明接下来将通过询问用户故事、功能/非功能需求等话题，定义高层级的产品需求。
2.  **分析上下文:** 读取并分析 `conductor/product.md` 以把握项目核心概念。
3.  **确定模式:** 使用 `ask_user` 工具让用户选择偏好的方式。
    - **questions:**
        - **header:** "产品需求"
        - **question:** "你希望如何梳理产品需求？我可引导你推演用户故事与功能边界，或直接基于核心概念草拟需求。"
        - **type:** "choice"
        - **options:**
            - Label: "交互式推演", Description: "我将引导你回答关于用户故事与功能目标的问题。"
            - Label: "自动草拟", Description: "我将直接基于产品定义草拟需求文档。"

5.  **收集信息 (条件分支):**
    -   **若选“自动草拟”:** 跳过此步，直接进入 **步骤 6 (草拟逻辑)**。
    -   **若选“交互式推演”:** 使用单个 `ask_user` 工具调用收集详细需求。
        -   **CRITICAL:** 批量提交最多 4 个问题（如用户故事、核心特性、技术约束、非功能性需求）。
        -   **SUGGESTIONS:** 为每个问题提供 3 个基于项目目标的高质量建议答案。
        -   **提问规范:** 使用 "choice" 类型，累加式回答设 `multiSelect` 为 `true`。构建 `questions` 数组，每个对象包含 `header` (不超过 16 字符)、`question` 与 `options` (均含 `label` 与 `description`)。
        -   **Note:** 严禁在此包含“自动草拟”选项。
        -   **交互流:** 等待用户回复后进入下一步。

6.  **草拟逻辑:** 收集充分信息后（或选了自动草拟），生成产品需求草案。
    -   **CRITICAL:** 用户选定的答案是生成需求的**唯一事实来源**。
7.  **用户核对确认环节:**
    -   **通告:** 简要说明需求草案已就绪。不要在聊天正文中重复审查请求。
    -   **征求确认:** 使用 `ask_user` 工具请求确认。将草拟需求直接嵌入 `question` 字段。
        - **questions:**
            - **header:** "审查需求"
            - **question:**
                请审查下方草拟的产品需求。接下来你想怎么做？

                ---

                <此处插入草拟的需求内容>
            - **type:** "choice"
            - **multiSelect:** false
            - **options:**
                - Label: "批准通过", Description: "需求完善详尽，进入下一步。"
                - Label: "修改调整", Description: "我想对草案内容进行修改。"
8.  **继续:** 获批后，在上下文中保留这些需求，并立即在下一小节提议首个轨道。

### 3.2 提议首个初始轨道 (自动化 + 授权)
1.  **明确目标:** 向用户通告接下来将提议一个初始轨道以启动项目。简要说明“轨道 (Track)”是一个高层次的工作单元（如功能特性或 Bug 修复），用于组织项目开发。
2.  **生成轨道名称:** 结合项目上下文（`product.md`, `tech-stack.md`）以及前序需求，生成一个概括首个轨道的标题。
    - **Greenfield:** 聚焦于 MVP 核心（例如："构建核心开销记录与统计功能"）。
    - **Brownfield:** 聚焦于维护或针对性增强（例如："实现用户身份认证流程"）。
3.  **确认提议:** 使用 `ask_user` 工具验证该提议：
    - **questions:**
        - **header:** "确认首轨"
        - **type:** "choice"
        - **multiSelect:** false
        - **question:** "为了启动项目，我建议创建首个轨道：'<Track Title>'。是否继续推进此轨道？"
        - **options:**
            - Label: "是", Description: "以 '<Track Title>' 作为首轨开启推进。"
            - Label: "修改调整", Description: "我想定义一个不同的轨道。"
4.  **执行操作:**
    -   **若用户选“是”:** 使用建议的 '<Track Title>' 作为轨道描述。
    -   **若用户选“修改调整”:**
        -   立即再次调用 `ask_user` 工具：
            - **header:** "新轨道描述"
            - **type:** "text"
            - **question:** "请输入初始轨道的描述："
            - **placeholder:** "例如：搭建基础 CI/CD 流水线"
        -   将用户的文本回复作为轨道描述。
    -   携带确定的轨道描述进入 **Section 3.3**。

### 3.3 将初始轨道转化为实体工件 (自动化)
1.  **明确目标:** 轨道确认后，通告接下来将为该初始轨道创建工件。
2.  **初始化轨道注册表文件:** 创建 `conductor/tracks.md` 文件，包含初始标题与首个轨道：
    ```markdown
    # Project Tracks

    This file tracks all major tracks for the project. Each track has its own detailed plan in its respective folder.

    ---

    - [ ] **Track: <Track Description>**
      *Link: [./<Tracks Directory Name>/<track_id>/](./<Tracks Directory Name>/<track_id>/)*
    ```
    （将 `<Tracks Directory Name>` 替换为通过协议解析出的实际 tracks 目录名称。）
3.  **生成轨道工件:**
    a. **确立轨道:** 获批的标题即为轨道描述 `<Track Description>`。
    b. **生成轨道专属的 Spec 与 Plan:**
        i. 自动为该轨道生成详尽的 `spec.md`。
        ii. 自动为该轨道生成分阶段的 `plan.md`。
            - **CRITICAL:** 任务结构必须严格契合 `conductor/workflow.md` 中规定之原则（例如若规定了测试驱动开发 TDD，则每个特性任务必须拆解为“编写测试”子任务与随后的“实现特性”子任务）。
            - **CRITICAL: 状态标记格式.** 针对**每一个**任务与子任务，必须包含状态标记 `[ ]`。格式严格为：
                - 主任务: `- [ ] Task: ...`
                - 子任务: `    - [ ] ...`
            - **CRITICAL: 注入阶段验收元任务 (Phase Completion Tasks).** 必须读取 `conductor/workflow.md` 检查是否定义了“Phase Completion Verification and Checkpointing Protocol”。若存在，则在 `plan.md` 生成的**每一个 Phase (阶段)** 末尾，必须追加固定的阶段验收元任务。其英文机器格式严格为：`- [ ] Task: Conductor - User Manual Verification '<Phase Name>' (Protocol in workflow.md)`（将 `<Phase Name>` 替换为实际阶段名称）。
    c. **创建轨道工件:**
        i. **生成并记录 Track ID:** 基于轨道描述使用 `shortname_YYYYMMDD` 格式生成唯一的 Track ID 并记录。针对该轨道的所有后续步骤必须始终使用此完全相同的 ID。
        ii. **创建专属目录:** 通过 **Universal File Resolution Protocol** 解析 **Tracks Directory** 路径，并创建新目录：`<Tracks Directory>/<track_id>/`。
        iii. **创建 `metadata.json`:** 在该新目录下创建 `metadata.json`，结构如下：
            - ```json
            {
            "track_id": "<track_id>",
            "type": "feature", // or "bug"
            "status": "new", // or in_progress, completed, cancelled
            "created_at": "YYYY-MM-DDTHH:MM:SSZ",
            "updated_at": "YYYY-MM-DDTHH:MM:SSZ",
            "description": "<Initial user description>"
            }
            ```
        使用真实有效的值填充，并填入当前精确时间戳。
        iv. **写入 Spec 与 Plan 文件:** 在同一目录下写入生成的 `spec.md` 与 `plan.md`。
        v.  **写入索引文件:** 在同一目录下写入 `index.md`，内容如下：
            ```markdown
            # Track <track_id> Context

            - [Specification](./spec.md)
            - [Implementation Plan](./plan.md)
            - [Metadata](./metadata.json)
            ```
            *(若是从 Audit 审计阶段跳转至此修复缺失的索引，使用已有目录的 track_id 写入此文件，随后进入步骤 d。)*

    d. **退出 Plan Mode:** 调用 `exit_plan_mode` 工具，传入路径：`<Tracks Directory>/<track_id>/index.md`。

    e. **通告进展:** 告知用户已为 "<Track Description>" 成功创建轨道。

### 3.4 最终通告与收尾
1.  **宣布完成:** 轨道创建完毕后，向用户宣布项目初始化与首个轨道生成均已圆满完成。
2.  **提交 Conductor 文件:** 暂存并提交所有新增文件，提交信息为：`conductor(setup): Add conductor setup files`。
3.  **后续指引:** 告知用户现在可以运行 `/conductor:implement` 开始具体的编码工作。
"""
