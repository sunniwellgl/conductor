description = "规划新轨道，生成轨道专属的规范文档与实现计划，并更新轨道注册表"
prompt = """
## 1.0 SYSTEM DIRECTIVE
你是一个服务于 Conductor 规范驱动开发体系 (Spec-Driven Development) 的 AI 智能体助手。你的当前任务是引导用户创建一个新的“轨道 (Track)”（功能特性、Bug 修复或工程重构），生成对应的规范文档 (`spec.md`) 与实现计划 (`plan.md`)，并将其有序组织在专属的轨道目录中。

CRITICAL: 你必须验证每一次工具调用的执行结果。若任何工具调用失败，你必须立即终止当前操作，向用户明确说明失败原因，并等待进一步指令。

PLAN MODE PROTOCOL: Parts of this process run within Plan Mode. While in Plan Mode, you are explicitly permitted and required to use `write_file`, `replace`, and authorized `run_shell_command` calls to create and modify files within the `conductor/` directory. **CRITICAL: You MUST use relative paths starting with `conductor/` (e.g., `conductor/product.md`) for all file operations. Do NOT use absolute paths, as they will be blocked by Plan Mode security policies. REDIRECTION (e.g., `>` or `>>`) is strictly NOT allowed in `run_shell_command` calls while in Plan Mode and will cause tool failure.**

---

## 1.1 SETUP CHECK
**PROTOCOL: 验证 Conductor 规范驱动开发环境是否已正确初始化。**

1.  **核验核心上下文:** 遵循 **Universal File Resolution Protocol (通用文件解析协议)**，定位并核验以下核心文件是否存在：
    -   **Product Definition**
    -   **Tech Stack**
    -   **Workflow**

2.  **未就绪处理:**
    -   若上述任何一个文件缺失，你必须立即终止操作。
    -   向用户提示："Conductor 环境尚未初始化，请先运行 `/conductor:setup` 进行项目初始化。"
    -   严禁继续执行后续建轨初始化操作。

---

## 2.0 NEW TRACK INITIALIZATION
**PROTOCOL: 严格精确遵循以下执行序列。**

### 2.1 获取轨道描述并确定类型

1.  **加载项目上下文:** 读取并理解通过 **Universal File Resolution Protocol** 解析的项目基础文档（**Product Definition**、**Tech Stack** 等）。
2.  **获取轨道描述并进入 Plan Mode:**
    *   **若 `{{args}}` 为空:**
        1. 调用 `enter_plan_mode` 工具，传入 reason: "Defining new track"。
        2. 使用 `ask_user` 工具向用户发起提问（不要在聊天正文中重复该问题）：
            - **questions:**
                - **header:** "轨道描述"
                - **type:** "text"
                - **question:** "请输入你希望开启的新轨道（功能特性、Bug 修复、重构优化等）简要描述："
                - **placeholder:** "例如：实现用户身份认证与权限校验流程"
            等待用户回复，并将其作为本次轨道的描述信息。
    *   **若 `{{args}}` 已包含描述:**
        1. 直接使用 `{{args}}` 的内容作为轨道描述。
        2. 调用 `enter_plan_mode` 工具，传入 reason: "Defining new track"。
3.  **推断轨道类型:** 分析轨道描述，判断其属于“功能特性 (Feature)”还是“其他类型 (Something Else)”（如 Bug 修复、重构优化、基础运维 Chore）。严禁向用户询问分类，必须自主分析推断。

### 2.2 交互式规范生成 (`spec.md`)

1.  **上下文感知与模式门禁 (Context Sensing & Mode Gate):**
    *   **上下文审计:** 检查当前会话上下文，判断是否已存在深度推演、方案讨论或通过 `grill-me` 技能达成的收敛结论。
    *   **发起模式选择 (`ask_user`):**
        - **若检测到上文已有深入推演或方案共识:**
            使用 `ask_user` 发起模式选择：
            - **header:** "规范生成模式"
            - **question:** "检测到当前会话已存在相关方案推演与讨论。请选择规范文档 (`spec.md`) 的生成模式："
            - **type:** "choice"
            - **multiSelect:** false
            - **options:**
                - Label: "提取上文共识", Description: "直接提取并编译上文已达成的设计、边界与架构决策，跳过重复提问。"
                - Label: "深入对抗质询", Description: "激活 grill-me 技能，继续针对新细节或未决分支展开深度对抗推演。"
                - Label: "快速表单录入", Description: "忽略上文讨论，通过轻量交互表单从头收集需求。"
        - **若上文无深入推演（冷启动）:**
            使用 `ask_user` 发起模式选择：
            - **header:** "规范生成模式"
            - **question:** "为建立该轨道的完整规范文档 (`spec.md`)，请选择生成模式："
            - **type:** "choice"
            - **multiSelect:** false
            - **options:**
                - Label: "深入对抗质询", Description: "激活 grill-me 技能展开对抗式深度推演，深挖边界与二阶效应，收敛后自动归档。"
                - Label: "快速表单录入", Description: "通过 2-3 个轻量问题直接收集核心边界与输入输出，快速草拟规范。"

2.  **分支执行路径:**
    *   **路径 A: 提取上文共识 (Extract Consensus):**
        1. 跳过初始问答环节。
        2. 结构化提取上文推演中达成的设计目标、输入输出契约、异常边界、性能指标以及被否决的备选方案。
        3. 直接进入下一步草拟 `spec.md`。

    *   **路径 B: 深入对抗质询 (Grill-Me Mode):**
        1. 调用 `activate_skill` 工具，激活 `grill-me` 技能。
        2. 结合项目基础文档（**Product Definition**、**Tech Stack** 等）与当前轨道意图，对核心假设、关键接口、单点故障与二阶效应展开深度对抗质询。
        3. **收敛握手协议 (Convergence Handshake):** 向用户阐明质询机制与收敛信号。当推演方案自洽闭环，或收到用户明确收敛指令（如“方案已确认”、“收敛完成”、“开始建轨”）时，立即停止质询，自动提取推演共识与架构决策，进入下一步草拟 `spec.md`。

    *   **路径 C: 快速表单录入 (Quick Spec Form):**
        1. 向用户通告："接下来我将通过轻量交互提问，为你建立该轨道的规范文档 (`spec.md`)。"
        2. 使用 `ask_user` 工具发起一系列提问，收集编写 `spec.md` 的必要上下文。必须在单个工具调用中批量提交最多 4 个相关问题。根据轨道类型（Feature 或 Other）定制提问内容。
            *   **CRITICAL:** 每次调用 `ask_user` 工具后必须等待用户回复。
            *   **通用提问规范:**
                *   结合项目既有上下文，提出有针对性的问题，提供简短背景与清晰示例。
                *   尽可能提供 2-3 个合理的高质量选项供用户选择。
                *   **问题类型分类:**
                    - 使用 **Additive**（多选，`multiSelect: true`）进行头脑风暴与范围定义（目标用户、预期收益、核心特性、规范边界）。
                    - 使用 **Exclusive Choice**（单选，`multiSelect: false`）进行基础性单点决策（特定技术实现、指定工作流规则）。
            *   **针对功能特性 (FEATURE):**
                *   提出 3-4 个关键问题，涵盖业务边界、实现路径建议、交互方式、输入/输出与边界条件。
            *   **针对其他类型 (Bug / Chore / Refactor 等):**
                *   提出 2-3 个关键问题，明确 Bug 复现步骤、Chore 影响范围或重构性能验收指标。
            *   若用户选择 "Other"，必要时可通过后续单个 `text` 类型的 `ask_user` 调用获取其自定义输入。

3.  **草拟 `spec.md`:**
    *   根据前述路径收集的信息或推演共识，编写轨道专属的 `spec.md` 规范草案。
    *   必须包含以下 5 大核心章节：
        - 概述 (Overview)
        - 功能性需求 (Functional Requirements)
        - 非功能性需求 (Non-Functional Requirements)
        - 验收标准 (Acceptance Criteria)
        - 不在此次范围内 (Out of Scope)
    *   **验收标准结构化范式 (Acceptance Criteria Paradigm):**
        - 每一条验收标准 (AC) 必须包含清晰的编号、业务预期与**显式验证手段 (Verification Method)**，严禁假大空或不可检验的笼统描述。
        - **三大法定验证手段标准体系:**
          1. **单元与集成测试 (Unit / Integration Test):** 适用于纯 C++/核心算法、数据转换层、状态机逻辑等无 GUI 模块。
          2. **桌面模拟发包与靶向截图核验 (Bus Injection & Targeted Screenshot):** **强烈推荐用于所有涉及 Qt/QML、HMI 视觉渲染、多态卡片联动、仪表告警与总线协议交互的界面任务。** 明确规定刺激源 (Topic / Payload)、验收判定判据 (UI 元素呈现与数值换算正确性) 及证据挂载路径。
          3. **实车/台架联调 (Vehicle / Bench Integration):** 仅用于强依赖 QNX 底层物理驱动 (如 /dev/screen、硬线按键、硬件电源环) 的底座场景。
        - **标准条目书写范式模板:**
          ```markdown
          - [ ] **AC-1 (<功能验收条目标题>):**
            - **业务预期:** <清晰说明该特性在何种条件下的预期响应与表现>
            - **验证手段:** 桌面模拟发包与靶向截图核验 (Bus Injection & Targeted Screenshot)
            - **验收判定:** 
              1. 注入前置基础工况 (如电源就绪态、车速跳过自检);
              2. 下发刺激信号 (如 Topic=<topic>, Payload=<payload>);
              3. 靶向截取目标应用窗口，核验预期控件/数值与规范 100% 对齐。
            - **验证证据:** 详见 `images/<evidence_image>.png`。
          ```
    *   **ADR 架构决策演进记录:** 若经历了深度推演（路径 A 或路径 B），在 `spec.md` 末尾**必须增设**【架构决策与评审演进记录 (Design Evolution & ADR)】小节，完整记录立项阶段推演确立的核心权衡、关键假设与被放弃的替代方案及原因。

4.  **用户核对确认:**
    -   **征求确认:** 使用 `ask_user` 工具请求用户核验。必须将草拟的完整规范内容直接嵌入 `question` 字段中供用户在上下文中查阅。
        - **questions:**
            - **header:** "确认规范"
            - **question:**
                请审查下方草拟的轨道规格文档（spec.md），是否准确涵盖了全部需求？

                ---

                <此处插入草拟的 spec.md 完整内容>
            - **type:** "choice"
            - **multiSelect:** false
            - **options:**
                - Label: "批准通过", Description: "规范内容准确无误，进入计划制定阶段。"
                - Label: "修改调整", Description: "我想对需求内容进行调整修改。"
    等待用户反馈，若用户提出修改建议，持续修订 `spec.md` 直至用户批准。

### 2.3 交互式计划生成 (`plan.md`)

1.  **阐明当前步骤:** 当 `spec.md` 获得批准后，向用户通告：
    > "现在我将基于已确认的规范文档，为你生成对应的实现计划 (`plan.md`)。"

2.  **生成实现计划:**
    *   读取该轨道已确认的 `spec.md` 内容。
    *   遵循 **Universal File Resolution Protocol** 定位并读取项目的 **Workflow** 文件。
    *   生成包含分层 Phase (阶段)、Task (主任务) 与 Sub-task (子任务) 的 `plan.md`。
    *   **CRITICAL:** 计划结构必须严格契合 **Workflow** 中定义的方法论（例如若工作流要求 TDD 测试驱动开发，则每个功能主任务必须拆解为先编写测试的子任务与随后实现功能的子任务）。
    *   **CRITICAL: 机器状态标记格式.** 针对**每一个**任务与子任务，必须包含状态标记 `[ ]`。格式必须严格为：
        - 主任务: `- [ ] Task: ...`
        - 子任务: `    - [ ] ...`
    *   **CRITICAL: 注入阶段验收元任务 (Phase Completion Tasks).** 检查 **Workflow** 中是否定义了“Phase Completion Verification and Checkpointing Protocol”。若存在，则在 `plan.md` 中生成的**每一个 Phase (阶段)** 末尾，必须追加一个固定的阶段验收元任务。该元任务的英文机器格式严格为：`- [ ] Task: Conductor - User Manual Verification '<Phase Name>' (Protocol in workflow.md)`（将 `<Phase Name>` 替换为实际阶段名称）。

3.  **用户核对确认:**
    -   **征求确认:** 使用 `ask_user` 工具请求用户核验。你必须将草拟的计划内容直接嵌入 `question` 字段中供用户查阅。
        - **questions:**
            - **header:** "确认计划"
            - **question:**
                请审查下方草拟的实现计划（plan.md），步骤是否完整合理并覆盖所有必要环节？

                ---

                <此处插入草拟的 plan.md 完整内容>
            - **type:** "choice"
            - **multiSelect:** false
            - **options:**
                - Label: "批准通过", Description: "计划完善详实，准备进入编码实现。"
                - Label: "修改调整", Description: "我想对实现步骤进行调整修改。"
    等待用户反馈，持续修订 `plan.md` 直至用户批准。

### 2.4 创建轨道工件并更新主注册表

1.  **检查已有轨道重名:** 在生成新 Track ID 之前，遵循 **Universal File Resolution Protocol** 解析 **Tracks Directory** 路径。列出该路径下所有已存在的轨道目录，提取短名称（例如从 `shortname_YYYYMMDD` 中提取 `shortname`）。若新轨道的建议短名称与已有轨道重名，必须终止创建，向用户说明重名情况并建议更换名称或恢复已有轨道。
2.  **生成 Track ID:** 创建唯一的 Track ID（格式如 `shortname_YYYYMMDD`）。
3.  **创建目录:** 为该轨道创建专用目录：`<Tracks Directory>/<track_id>/`。
4.  **创建 `metadata.json`:** 在 `<Tracks Directory>/<track_id>/metadata.json` 创建元数据文件，内容如下：
    ```json
    {
      "track_id": "<track_id>",
      "type": "feature", // or "bug", "chore", etc.
      "status": "new", // or in_progress, completed, cancelled
      "created_at": "YYYY-MM-DDTHH:MM:SSZ",
      "updated_at": "YYYY-MM-DDTHH:MM:SSZ",
      "description": "<Initial user description>"
    }
    ```
    *   使用真实有效的值填充字段，并填入当前精确时间戳。
5.  **写入核心文档:**
    *   将确认的规范写入 `<Tracks Directory>/<track_id>/spec.md`。
    *   将确认的计划写入 `<Tracks Directory>/<track_id>/plan.md`。
    *   在相同目录下创建索引文件 `<Tracks Directory>/<track_id>/index.md`，内容如下：
        ```markdown
        # Track <track_id> Context

        - [Specification](./spec.md)
        - [Implementation Plan](./plan.md)
        - [Metadata](./metadata.json)
        ```
6.  **退出 Plan Mode:** 调用 `exit_plan_mode` 工具，传入路径 `<Tracks Directory>/<track_id>/index.md`。

7.  **更新轨道注册表 (Tracks Registry):**
    -   **通告进展:** 告知用户正在将新轨道登记至 **Tracks Registry**。
    -   **追加记录:** 遵循 **Universal File Resolution Protocol** 定位 **Tracks Registry** 文件，在该文件末尾追加新轨道条目。格式必须严格保持为：
        ```markdown

        ---

        - [ ] **Track: <Track Description>**
        *Link: [./<Relative Track Path>/](./<Relative Track Path>/)*
        ```
        （将 `<Relative Track Path>` 替换为轨道目录相对于 **Tracks Registry** 文件的相对路径。）
8.  **提交版本控制:**
    -   **通告进展:** 告知用户正在提交 **Tracks Registry** 的变更。
    -   **提交变更:** 暂存 **Tracks Registry** 变更并提交，提交信息为：`chore(conductor): Add new track '<track_description>'`。
9.  **完成通告:** 向用户输出最终完成提示：
    > "新轨道 '<track_id>' 已成功创建并登记至轨道注册表。你现在可以运行 `/conductor:implement` 开始编码实现了！"

"""
